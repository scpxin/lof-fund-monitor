name: LOF Fund Monitor

on:
  schedule:
    # 每个交易日 15:30 (UTC 时间 7:30)
    - cron: '30 7 * * 1-5'
    # 每周一到周五 20:00 (UTC 时间 12:00) 晚间加推一次
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run LOF Monitor
      env:
        SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
        PUSH_METHOD: ${{ vars.PUSH_METHOD }}
        PREMIUM_RATE_THRESHOLD: ${{ vars.PREMIUM_RATE_THRESHOLD }}
        PUSH_TIME: ${{ vars.PUSH_TIME }}
        LOF_FUND_CODES: ${{ vars.LOF_FUND_CODES }}
      run: python scheduler.py --once
